<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUNEX 页面模块素材库</title>
<style>
:root{--bg:#080a0b;--panel:#111516;--line:#303938;--text:#e8ecea;--muted:#9aa4a1;--orange:#d36f24}
*{box-sizing:border-box} [hidden]{display:none!important} html{scroll-behavior:smooth} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Microsoft YaHei UI",sans-serif}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 24px;background:rgba(8,10,11,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.brand{font-weight:700;letter-spacing:.22em}.header-tools{display:flex;align-items:center;gap:14px}.count{color:var(--muted);font:12px Consolas,monospace}.view-switch{display:flex;gap:6px}.view-switch button{padding:7px 12px}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 57px)}
.library-aside,.composer-nav{padding:20px;border-right:1px solid var(--line);background:#0b0e0f}
.label{font:11px Consolas,monospace;color:var(--muted);letter-spacing:.12em;margin:0 0 10px}.filters{display:grid;gap:7px;margin-bottom:24px}
button,select{font:inherit;color:var(--text);background:transparent;border:1px solid var(--line);padding:10px 12px;text-align:left;cursor:pointer;border-radius:2px}
button:hover,button.active{border-color:var(--orange);color:#fff}select{width:100%;background:#111516}
.library-main{min-width:0;padding:22px;display:grid;grid-template-rows:auto 1fr auto;gap:16px}.meta{display:flex;align-items:end;justify-content:space-between;gap:20px}
h1{font-size:26px;margin:0 0 5px}.sub{margin:0;color:var(--muted);font-size:13px}.stage{min-height:0;display:grid;place-items:center;overflow:auto;background:#050606;border:1px solid var(--line);padding:14px}
.stage img{display:block;max-width:100%;max-height:calc(100vh - 210px);width:auto;height:auto;box-shadow:0 18px 55px rgba(0,0,0,.45)}
.controls{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}.controls button{text-align:center;min-width:112px}.progress{height:2px;background:var(--line)}.progress i{display:block;height:100%;background:var(--orange);transition:width .18s ease}
.links{display:flex;gap:8px;flex-wrap:wrap}.links a{color:var(--muted);font-size:12px;text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:3px}.links a:hover{color:white;border-color:var(--orange)}
#composerView{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 57px)}#composerView[hidden]{display:none}.composer-nav{position:sticky;top:57px;height:calc(100vh - 57px);z-index:4}.composer-nav .filters{margin-bottom:14px}.composer-nav .utility{width:100%;color:var(--muted)}
.composer-main{min-width:0;padding:30px 42px 70px;background:#0d1011}.composer-heading{max-width:1180px;margin:0 auto 18px;display:flex;justify-content:space-between;align-items:end;gap:15px}.composer-frame{max-width:1180px;margin:auto;background:#050606;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.composer-section{position:relative;border:1px solid transparent;cursor:pointer;line-height:0}.composer-section:hover,.composer-section.active{border-color:var(--orange);z-index:1}.composer-section img{display:block;width:100%;height:auto}.composer-badge{position:absolute;left:12px;top:12px;padding:7px 9px;background:rgba(8,10,11,.82);color:#fff;font:11px Consolas,monospace;line-height:1;border:1px solid rgba(255,255,255,.2);opacity:0;transition:.15s}.composer-section:hover .composer-badge,.composer-section.active .composer-badge{opacity:1}
.asset-drawer{position:fixed;z-index:30;top:0;right:0;width:min(460px,92vw);height:100vh;padding:20px;background:#0d1112;border-left:1px solid var(--line);box-shadow:-28px 0 80px rgba(0,0,0,.55);transform:translateX(102%);transition:transform .2s ease;overflow:auto}.asset-drawer.open{transform:translateX(0)}.drawer-head{position:sticky;top:-20px;z-index:2;display:flex;align-items:center;justify-content:space-between;background:#0d1112;padding:20px 0 13px}.drawer-head h2{margin:0;font-size:20px}.drawer-head button{font-size:22px;padding:5px 11px}.drawer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.asset-option{padding:7px;background:#111516}.asset-option.selected{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}.asset-option img{width:100%;aspect-ratio:3/1;object-fit:cover;display:block;margin-bottom:7px}.asset-option span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.asset-option strong{color:var(--text);margin-right:5px}
#reviewView{min-height:calc(100vh - 57px);display:grid;grid-template-columns:minmax(0,1fr) 270px;background:#090b0c}.review-main{min-width:0;padding:24px;display:grid;grid-template-rows:minmax(360px,1fr) auto auto;gap:14px}.review-stage{display:grid;place-items:center;min-height:0;background:#050606;border:1px solid var(--line);overflow:hidden}.review-stage img{display:block;max-width:100%;max-height:calc(100vh - 245px);width:auto;height:auto}.review-info{display:flex;align-items:center;justify-content:space-between;gap:18px}.review-copy h1{margin:0 0 5px}.cloud-state{font-size:12px;color:var(--muted)}.cloud-state.error{color:#e59962}.review-controls{display:grid;grid-template-columns:auto auto 1fr auto auto;align-items:center;gap:10px}.review-controls button{text-align:center}.like-button.liked{background:var(--orange);border-color:var(--orange);color:#fff}.review-sidebar{padding:16px;background:#0b0e0f;border-left:1px solid var(--line);overflow:auto;max-height:calc(100vh - 57px);position:sticky;top:57px}.review-thumbs{display:grid;gap:8px;margin-top:12px}.review-thumb{padding:6px;background:#111516}.review-thumb.active{border-color:var(--orange)}.review-thumb img{display:block;width:100%;aspect-ratio:3/1;object-fit:cover}.review-thumb span{display:block;margin-top:5px;color:var(--muted);font-size:10px}.review-complete{padding:12px;border:1px solid var(--orange);color:#f2c39d;background:#1c120b}.review-complete button{margin:8px 6px 0 0}
#resultsView{min-height:calc(100vh - 57px);padding:32px 4vw 70px}.results-head{max-width:1200px;margin:0 auto 22px}.ranking-banner{max-width:1200px;margin:0 auto 18px;padding:12px 14px;border:1px solid var(--line);color:var(--muted)}.ranking-section{max-width:1200px;margin:0 auto 34px}.ranking-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.rank-card{background:#111516;border:1px solid var(--line);padding:9px}.rank-card img{display:block;width:100%;aspect-ratio:3/1;object-fit:cover}.rank-meta{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:12px}.rank-meta span{color:var(--muted)}.rank-meta strong{color:#f0a46e}.category-ranking{margin-top:22px}.category-ranking h3{border-bottom:1px solid var(--line);padding-bottom:8px}
@media(max-width:780px){header{align-items:flex-start;padding:10px 12px}.brand{font-size:12px}.header-tools{align-items:flex-end;flex-direction:column;gap:7px}.view-switch{max-width:78vw;overflow-x:auto}.view-switch button{white-space:nowrap}.count{display:none}.layout{grid-template-columns:1fr}.library-aside{border-right:0;border-bottom:1px solid var(--line)}.filters{grid-template-columns:repeat(2,1fr)}.stage img{max-height:65vh}#composerView{display:block}.composer-nav{position:sticky;top:69px;height:auto;padding:10px;border-right:0;border-bottom:1px solid var(--line)}.composer-nav .label{display:none}.composer-nav .filters{display:flex;overflow-x:auto;margin:0 0 8px}.composer-nav .filters button{flex:0 0 auto}.composer-nav .utility{width:auto}.composer-main{padding:18px 10px 70px}.composer-heading{align-items:start;flex-direction:column}.asset-drawer{top:auto;bottom:0;width:100%;height:min(68vh,600px);transform:translateY(102%);border-left:0;border-top:1px solid var(--line)}.asset-drawer.open{transform:translateY(0)}#reviewView{display:flex;flex-direction:column}.review-main{order:1;padding:10px;display:block}.review-stage{min-height:45vh}.review-stage img{max-height:55vh}.review-info{align-items:flex-start;flex-direction:column;margin:12px 0}.review-controls{grid-template-columns:1fr 1fr;gap:7px}.review-controls .progress{grid-column:1/-1;order:-1}.review-sidebar{order:2;position:static;max-height:none;border-left:0;border-top:1px solid var(--line)}.review-thumbs{grid-template-columns:repeat(2,1fr)}.ranking-grid{grid-template-columns:1fr}#resultsView{padding:22px 12px 60px}}
</style>
</head>
<body>
<header><div class="brand">LUNEX SECTION LIBRARY</div><div class="header-tools"><div class="view-switch"><button id="showLibrary" class="active">素材浏览</button><button id="showComposer">首页拼装</button><button id="showReview">幻灯评审</button><button id="showResults">评审结果</button></div><div class="count" id="total"></div></div></header>
<div class="layout" id="libraryView">
<aside class="library-aside">
  <p class="label">CATEGORY / 分类</p><div class="filters" id="categories"></div>
  <p class="label">VERSION / 版本</p><select id="version"><option value="all">全部版本</option></select>
</aside>
<main class="library-main">
  <div class="meta"><div><h1 id="title"></h1><p class="sub" id="subtitle"></p></div><div class="links"><a id="openCrop" target="_blank">查看裁片</a><a id="openOriginal" target="_blank">查看原图</a></div></div>
  <div class="stage"><img id="image" alt="LUNEX 页面模块"></div>
  <div class="controls"><button id="prev">← 上一张</button><div><div class="progress"><i id="bar"></i></div></div><button id="next">下一张 →</button></div>
</main>
</div>
<section id="composerView" hidden>
  <aside class="composer-nav"><p class="label">PAGE SECTIONS / 页面区块</p><div class="filters" id="composerCategories"></div><button class="utility" id="restoreDefaults">恢复默认</button></aside>
  <main class="composer-main"><div class="composer-heading"><div><h1>首页拼装</h1><p class="sub">点击左侧分类或页面区块，从图片抽屉中选择替换。</p></div><p class="sub" id="composerSummary"></p></div><div class="composer-frame" id="composerCanvas"></div></main>
  <aside id="assetDrawer" class="asset-drawer" aria-hidden="true"><div class="drawer-head"><h2 id="drawerTitle"></h2><button id="closeDrawer" aria-label="关闭图片选择">×</button></div><div class="drawer-grid" id="drawerGrid"></div></aside>
</section>
<section id="reviewView" hidden>
  <main class="review-main">
    <div class="review-stage"><img id="reviewImage" alt="评审图片"></div>
    <div class="review-info"><div class="review-copy"><h1 id="reviewTitle"></h1><p class="sub" id="reviewMeta"></p></div><div><div class="cloud-state" id="cloudStatus">正在检查云端评审…</div><button id="refreshStats" hidden>刷新统计</button></div></div>
    <div><div class="review-controls"><button id="reviewPrev">← 上一张</button><button id="likeButton" disabled>云端评审未连接</button><div><div class="progress"><i id="reviewBar"></i></div><p class="sub" id="reviewProgress"></p></div><button id="reviewNext">下一张 →</button><button id="toggleThumbs">缩略图</button></div><div id="reviewComplete" class="review-complete" hidden></div></div>
  </main>
  <aside class="review-sidebar" id="reviewSidebar"><p class="label">FILTER / 播放范围</p><select id="reviewCategory"><option value="all">全部图片</option></select><div class="review-thumbs" id="reviewThumbs"></div></aside>
</section>
<section id="resultsView" hidden>
  <div class="results-head"><h1>评审结果</h1><p class="sub">查看全部图片和七个页面区块的受欢迎程度。</p></div>
  <div class="ranking-banner" id="rankingStatus"></div>
  <section class="ranking-section"><h2>全站热门</h2><div class="ranking-grid" id="overallRanking"></div></section>
  <section class="ranking-section"><h2>分类前三名</h2><div id="categoryRankings"></div></section>
</section>

const categoryOrder=["01-hero", "02-product", "03-scenarios", "04-in-the-box", "05-purchase", "06-benefits", "07-footer"];

let category=categoryOrder[0], version='all', cursor=0, view=[];
const $=id=>document.getElementById(id);
function rebuild(){
  view=all.filter(x=>x.category===category&&(version==='all'||String(x.version)===version));
  if(cursor>=view.length)cursor=0; render();
}
function render(){
  if(!view.length)return;
  const item=view[cursor];
  $('image').src=item.file; $('title').textContent=`${item.category_name} · V${String(item.version).padStart(2,'0')}`;
  $('subtitle').textContent=`${item.version_name}　${item.width} × ${item.height} px　第 ${cursor+1} / ${view.length} 张`;
  $('openCrop').href=item.file; $('openOriginal').href=item.original;
  $('bar').style.width=`${((cursor+1)/view.length)*100}%`; $('total').textContent=`${all.length} IMAGES / ${new Set(all.map(x=>x.version)).size} VERSIONS`;
}
const cat=$('categories'); categoryOrder.forEach(key=>{const b=document.createElement('button');b.textContent=categoryNames[key];b.dataset.key=key;b.onclick=()=>{category=key;cursor=0;[...cat.children].forEach(x=>x.classList.toggle('active',x===b));rebuild()};cat.appendChild(b)});cat.firstChild.classList.add('active');
const sel=$('version'); [...new Map(all.map(x=>[x.version,x.version_name]))].forEach(([v,n])=>{const o=document.createElement('option');o.value=v;o.textContent=`V${String(v).padStart(2,'0')} · ${n}`;sel.appendChild(o)});sel.onchange=()=>{version=sel.value;cursor=0;rebuild()};
$('prev').onclick=()=>{cursor=(cursor-1+view.length)%view.length;render()};$('next').onclick=()=>{cursor=(cursor+1)%view.length;render()};

const composerStorageKey='lunex-homepage-composer-v1';
const newestFor=key=>all.filter(x=>x.category===key).sort((a,b)=>Number(b.version)-Number(a.version))[0];
const loadComposer=()=>{
  let saved={};
  try{saved=JSON.parse(localStorage.getItem(composerStorageKey)||'{}')}catch(error){saved={}}
  return Object.fromEntries(categoryOrder.map(key=>{const valid=all.find(x=>x.category===key&&x.file===saved[key]);return [key,(valid||newestFor(key)).file]}));
};
let composerSelection=loadComposer(),activeComposerCategory=categoryOrder[0],composerVisible=false;
const saveComposer=()=>localStorage.setItem(composerStorageKey,JSON.stringify(composerSelection));
const selectedItem=key=>all.find(x=>x.category===key&&x.file===composerSelection[key])||newestFor(key);
function renderComposerNav(){
  const nav=$('composerCategories');nav.innerHTML='';categoryOrder.forEach(key=>{const b=document.createElement('button');const item=selectedItem(key);b.className=key===activeComposerCategory?'active':'';b.innerHTML=`${categoryNames[key]}<br><small>V${String(item.version).padStart(2,'0')} · ${item.version_name}</small>`;b.onclick=()=>{openDrawer(key);document.querySelector(`[data-composer-category="${key}"]`).scrollIntoView({behavior:'smooth',block:'center'})};nav.appendChild(b)});
}
function renderComposer(){
  const canvas=$('composerCanvas');canvas.innerHTML='';categoryOrder.forEach(key=>{const item=selectedItem(key);const section=document.createElement('section');section.className=`composer-section${key===activeComposerCategory?' active':''}`;section.dataset.composerCategory=key;section.innerHTML=`<span class="composer-badge">${categoryNames[key]} · V${String(item.version).padStart(2,'0')}</span><img src="${item.file}" alt="${categoryNames[key]} · ${item.version_name}">`;section.onclick=()=>openDrawer(key);canvas.appendChild(section)});$('composerSummary').textContent=categoryOrder.map(key=>`V${String(selectedItem(key).version).padStart(2,'0')}`).join(' / ');renderComposerNav();
}
function openDrawer(key){
  activeComposerCategory=key;const current=selectedItem(key);$('drawerTitle').textContent=`选择${categoryNames[key]}图片`;$('drawerGrid').innerHTML='';all.filter(x=>x.category===key).sort((a,b)=>Number(b.version)-Number(a.version)).forEach(item=>{const b=document.createElement('button');b.className=`asset-option${item.file===current.file?' selected':''}`;b.innerHTML=`<img src="${item.file}" alt=""><span><strong>V${String(item.version).padStart(2,'0')}</strong>${item.version_name}</span>`;b.onclick=()=>{composerSelection[key]=item.file;saveComposer();renderComposer();closeDrawer()};$('drawerGrid').appendChild(b)});$('assetDrawer').classList.add('open');$('assetDrawer').setAttribute('aria-hidden','false');renderComposer();
}
function closeDrawer(){$('assetDrawer').classList.remove('open');$('assetDrawer').setAttribute('aria-hidden','true')}
function restoreComposerDefaults(){composerSelection=Object.fromEntries(categoryOrder.map(key=>[key,newestFor(key).file]));saveComposer();renderComposer();closeDrawer()}

const reviewStorageKey='lunex-review-progress-v1';
const safeReviewState=()=>{
  let saved={};try{saved=JSON.parse(localStorage.getItem(reviewStorageKey)||'{}')}catch(error){saved={}}
  const validCategory=saved.category==='all'||categoryOrder.includes(saved.category)?saved.category:'all';
  const files=new Set(all.map(x=>x.file));const seen=Array.isArray(saved.seen)?saved.seen.filter(x=>files.has(x)):[];
  return {category:validCategory,cursor:Number.isInteger(saved.cursor)?Math.max(0,saved.cursor):0,seen};
};
let reviewState=safeReviewState(),currentMode='library',cloudClient=null,cloudConnected=false,cloudLoading=false,currentUserLikes=new Set(),likeCounts=new Map(),realtimeChannel=null,realtimeTimer=null;
const saveReviewState=()=>{try{localStorage.setItem(reviewStorageKey,JSON.stringify(reviewState))}catch(error){}}
const reviewItems=()=>reviewState.category==='all'?all:all.filter(x=>x.category===reviewState.category);
const currentReviewItem=()=>{const items=reviewItems();reviewState.cursor=Math.min(Math.max(reviewState.cursor,0),Math.max(items.length-1,0));return items[reviewState.cursor]};
function renderReviewThumbs(){
  const items=reviewItems(),current=currentReviewItem();$('reviewThumbs').innerHTML='';items.forEach((item,index)=>{const b=document.createElement('button');b.className=`review-thumb${item.file===current.file?' active':''}`;b.innerHTML=`<img src="${item.file}" alt=""><span>V${String(item.version).padStart(2,'0')} · ${item.version_name}</span>`;b.onclick=()=>selectReviewItem(item.file);$('reviewThumbs').appendChild(b)});
}
function renderReview(){
  const items=reviewItems();if(!items.length)return;const item=currentReviewItem();if(!reviewState.seen.includes(item.file))reviewState.seen.push(item.file);saveReviewState();
  $('reviewImage').src=item.file;$('reviewTitle').textContent=`${item.category_name} · V${String(item.version).padStart(2,'0')}`;$('reviewMeta').textContent=`${item.version_name}　${item.width} × ${item.height} px`;
  const count=likeCounts.get(item.file)||0,liked=currentUserLikes.has(item.file);$('likeButton').classList.toggle('liked',liked);$('likeButton').textContent=cloudConnected?`${liked?'♥ 已点赞':'♡ 点赞'} · ${count}`:'云端评审未连接';$('likeButton').disabled=!cloudConnected||cloudLoading;
  $('reviewProgress').textContent=`第 ${reviewState.cursor+1} / ${items.length} 张　已看 ${reviewState.seen.filter(file=>items.some(x=>x.file===file)).length} / ${items.length}`;$('reviewBar').style.width=`${((reviewState.cursor+1)/items.length)*100}%`;
  $('reviewComplete').hidden=true;renderReviewThumbs();
}
function selectReviewItem(file){const index=reviewItems().findIndex(x=>x.file===file);if(index<0)return;reviewState.cursor=index;saveReviewState();renderReview()}
function moveReview(delta){
  const items=reviewItems(),next=reviewState.cursor+delta;if(next>=items.length){$('reviewComplete').hidden=false;$('reviewComplete').innerHTML='已看完当前范围。<br><button id="completeResults">查看评审结果</button><button id="restartReview">重新观看</button>';$('completeResults').onclick=()=>setMode('results');$('restartReview').onclick=()=>{reviewState.cursor=0;saveReviewState();renderReview()};return}
  reviewState.cursor=(next+items.length)%items.length;saveReviewState();renderReview();
}
function setCloudStatus(kind,message){const el=$('cloudStatus');el.className=`cloud-state${kind==='error'?' error':''}`;el.textContent=message;}
async function reloadCloudData(){
  if(!cloudClient)return;cloudLoading=true;if(currentMode==='review')renderReview();
  try{const [countsResult,likesResult]=await Promise.all([cloudClient.rpc('lunex_like_counts'),cloudClient.from('image_likes').select('image_key')]);if(countsResult.error)throw countsResult.error;if(likesResult.error)throw likesResult.error;likeCounts=new Map((countsResult.data||[]).map(x=>[x.image_key,Number(x.like_count)]));currentUserLikes=new Set((likesResult.data||[]).map(x=>x.image_key));cloudConnected=true;setCloudStatus('connected','云端评审已连接 · 实时同步');$('refreshStats').hidden=true;}catch(error){setCloudStatus('error','同步失败，请重试');$('refreshStats').hidden=false;}finally{cloudLoading=false;if(currentMode==='review')renderReview();if(currentMode==='results')renderRankings()}
}
async function toggleLike(){
  if(!cloudClient||!cloudConnected||cloudLoading)return;const item=currentReviewItem();cloudLoading=true;renderReview();
  try{const result=currentUserLikes.has(item.file)?await cloudClient.from('image_likes').delete().eq('image_key',item.file):await cloudClient.from('image_likes').insert({image_key:item.file});if(result.error)throw result.error;await reloadCloudData()}catch(error){cloudLoading=false;setCloudStatus('error','提交失败，请重试');renderReview()}
}
function subscribeRealtime(){
  if(!cloudClient)return;realtimeChannel=cloudClient.channel('lunex-like-changes').on('postgres_changes',{event:'*',schema:'public',table:'image_likes'},()=>{clearTimeout(realtimeTimer);realtimeTimer=setTimeout(reloadCloudData,400)}).subscribe(status=>{if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){setCloudStatus('error','实时更新暂不可用');$('refreshStats').hidden=false}});
}
async function initCloudReview(){
  const config=window.LUNEX_SUPABASE||{};if(!config.url||!config.publishableKey||!window.supabase){setCloudStatus('disconnected','尚未连接云端评审');$('rankingStatus').textContent='云端评审未连接，排名将在连接后显示真实数据。';renderReview();renderRankings();return}
  setCloudStatus('loading','正在连接云端评审…');try{cloudClient=window.supabase.createClient(config.url,config.publishableKey);const sessionResult=await cloudClient.auth.getSession();if(sessionResult.error)throw sessionResult.error;if(!sessionResult.data.session){const signInResult=await cloudClient.auth.signInAnonymously();if(signInResult.error)throw signInResult.error}await reloadCloudData();subscribeRealtime()}catch(error){cloudClient=null;cloudConnected=false;setCloudStatus('error','云端评审连接失败');$('refreshStats').hidden=false;renderReview();renderRankings()}
}
function rankedItems(){return all.map(item=>({...item,like_count:likeCounts.get(item.file)||0})).sort((a,b)=>b.like_count-a.like_count||Number(b.version)-Number(a.version)||a.file.localeCompare(b.file))}
function rankCard(item,index){return `<article class="rank-card"><img src="${item.file}" alt=""><div class="rank-meta"><span>#${index+1}　${item.category_name} · V${String(item.version).padStart(2,'0')}<br>${item.version_name}</span><strong>♥ ${item.like_count}</strong></div></article>`}
function renderRankings(){
  const ranked=rankedItems();$('rankingStatus').textContent=cloudConnected?'排名依据当前云端点赞实时汇总。':'云端评审未连接，排名将在连接后显示真实数据。';$('overallRanking').innerHTML=ranked.map(rankCard).join('');$('categoryRankings').innerHTML=categoryOrder.map(key=>{const top=ranked.filter(x=>x.category===key).slice(0,3);return `<section class="category-ranking"><h3>${categoryNames[key]}</h3><div class="ranking-grid">${top.map(rankCard).join('')}</div></section>`}).join('');
}
function setMode(mode){
  currentMode=mode;composerVisible=mode==='composer';$('libraryView').hidden=mode!=='library';$('composerView').hidden=mode!=='composer';$('reviewView').hidden=mode!=='review';$('resultsView').hidden=mode!=='results';
  [['showLibrary','library'],['showComposer','composer'],['showReview','review'],['showResults','results']].forEach(([id,value])=>$(id).classList.toggle('active',mode===value));if(mode==='composer')renderComposer();else closeDrawer();if(mode==='review')renderReview();if(mode==='results')renderRankings();window.scrollTo({top:0,behavior:'smooth'});
}
$('showLibrary').onclick=()=>setMode('library');$('showComposer').onclick=()=>setMode('composer');$('showReview').onclick=()=>setMode('review');$('showResults').onclick=()=>setMode('results');$('closeDrawer').onclick=closeDrawer;$('restoreDefaults').onclick=restoreComposerDefaults;
const reviewSelect=$('reviewCategory');categoryOrder.forEach(key=>{const o=document.createElement('option');o.value=key;o.textContent=categoryNames[key];reviewSelect.appendChild(o)});reviewSelect.value=reviewState.category;reviewSelect.onchange=()=>{reviewState.category=reviewSelect.value;reviewState.cursor=0;saveReviewState();renderReview()};
$('reviewPrev').onclick=()=>moveReview(-1);$('reviewNext').onclick=()=>moveReview(1);$('likeButton').onclick=toggleLike;$('refreshStats').onclick=reloadCloudData;$('toggleThumbs').onclick=()=>$('reviewSidebar').classList.toggle('collapsed');
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if(currentMode==='library'&&e.key==='ArrowLeft')$('prev').click();if(currentMode==='library'&&e.key==='ArrowRight')$('next').click();if(currentMode==='review'&&e.key==='ArrowLeft')moveReview(-1);if(currentMode==='review'&&e.key==='ArrowRight')moveReview(1)});rebuild();renderComposer();renderReview();renderRankings();initCloudReview();
</script>
</body>
</html>
