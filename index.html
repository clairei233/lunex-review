<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUNEX 首页拼装与评审</title>
<style>
:root{--bg:#080a0b;--panel:#111516;--panel2:#0b0e0f;--line:#303938;--text:#e8ecea;--muted:#9aa4a1;--orange:#d36f24;--orange2:#f0a46e}
*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Microsoft YaHei UI",sans-serif}
button,select{font:inherit;color:var(--text);background:#111516;border:1px solid var(--line);padding:9px 12px;cursor:pointer;border-radius:3px}button:hover,button:focus-visible,button.active,select:focus{border-color:var(--orange);outline:none}button:disabled{opacity:.45;cursor:not-allowed}
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 24px;background:rgba(8,10,11,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.brand{font-weight:700;letter-spacing:.2em}.header-tools,.view-switch,.toolbar-actions,.drawer-filters,.results-filters{display:flex;align-items:center;gap:8px}.cloud-state{font-size:12px;color:var(--muted)}.cloud-state.connected{color:#82b99b}.cloud-state.error{color:#e59962}
#composerView{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 58px)}
.composer-nav{position:sticky;top:58px;height:calc(100vh - 58px);padding:20px;border-right:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;gap:9px}.composer-nav button{text-align:left}.composer-nav .primary{color:#fff;border-color:#78451f}.label{font:11px Consolas,monospace;color:var(--muted);letter-spacing:.12em;margin:4px 0 2px}.seen-card{margin-top:10px;padding:13px;border:1px solid var(--line);color:var(--muted);font-size:12px}.seen-card strong{display:block;color:var(--text);font-size:20px;margin-bottom:5px}
.composer-main{min-width:0;padding:26px 38px 70px;background:#0d1011}.composer-heading{max-width:1180px;margin:0 auto 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:18px}.composer-heading h1,.results-head h1{margin:0 0 5px}.sub{margin:0;color:var(--muted);font-size:13px}.composer-frame{max-width:1180px;margin:auto;background:#050606;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.composer-section{position:relative;line-height:0;border:2px solid transparent;transition:border-color .15s,opacity .15s}.composer-section.active,.composer-section:hover,.composer-section:focus-within{border-color:var(--orange);z-index:2}.composer-section.dragging{opacity:.4}.composer-section.drop-before:before,.composer-section.drop-after:after{content:"";position:absolute;z-index:8;left:-2px;right:-2px;height:4px;background:var(--orange)}.composer-section.drop-before:before{top:-4px}.composer-section.drop-after:after{bottom:-4px}.composer-section>img{display:block;width:100%;height:auto}
.section-toolbar{position:absolute;z-index:5;left:10px;right:10px;top:10px;display:flex;align-items:center;gap:6px;padding:7px;background:rgba(8,10,11,.9);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(9px);opacity:0;transform:translateY(-5px);transition:.15s;line-height:1.2}.composer-section:hover .section-toolbar,.composer-section.active .section-toolbar,.composer-section:focus-within .section-toolbar{opacity:1;transform:none}.section-toolbar button{padding:7px 9px;background:rgba(17,21,22,.9);white-space:nowrap}.section-toolbar .drag-handle{cursor:grab}.section-meta{margin-right:auto;color:#fff;font-size:12px;line-height:1.35}.section-meta small{display:block;color:var(--muted)}.like-button.liked{background:var(--orange);border-color:var(--orange)}
.asset-drawer{position:fixed;z-index:50;top:0;right:0;width:min(520px,94vw);height:100vh;padding:20px;background:#0d1112;border-left:1px solid var(--line);box-shadow:-28px 0 80px rgba(0,0,0,.55);transform:translateX(102%);transition:transform .2s ease;overflow:auto}.asset-drawer.open{transform:translateX(0)}.drawer-head{position:sticky;top:-20px;z-index:3;display:flex;align-items:center;justify-content:space-between;background:#0d1112;padding:20px 0 12px}.drawer-head h2{margin:0}.drawer-filters{position:sticky;top:54px;z-index:2;padding:0 0 12px;background:#0d1112}.drawer-filters select{width:50%}.drawer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.asset-option{padding:7px;text-align:left}.asset-option.selected{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}.asset-option img{display:block;width:100%;aspect-ratio:3/1;object-fit:cover;margin-bottom:7px}.asset-option span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.asset-option strong{color:var(--text);margin-right:5px}
#resultsView{min-height:calc(100vh - 58px);padding:30px 4vw 70px}.results-head,.results-tools,.ranking-grid,#resultEmpty{max-width:1240px;margin-left:auto;margin-right:auto}.results-head{margin-bottom:17px}.results-tools{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.results-filters{flex-wrap:wrap}.results-filters select{min-width:150px}.result-summary{color:var(--muted);font-size:13px;white-space:nowrap}.ranking-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.rank-card{background:var(--panel);border:1px solid var(--line);padding:9px;text-align:left}.rank-card:hover{border-color:var(--orange)}.rank-card img{display:block;width:100%;aspect-ratio:3/1;object-fit:cover}.rank-meta{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:12px;line-height:1.4}.rank-meta span{color:var(--muted)}.rank-meta strong{color:var(--orange2)}#resultEmpty{text-align:center;padding:80px 20px;border:1px dashed var(--line);color:var(--muted)}#resultEmpty button{margin-left:8px}
.toast{position:fixed;z-index:80;left:50%;bottom:26px;transform:translate(-50%,20px);background:#f2eee8;color:#17191a;padding:10px 15px;border-radius:4px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){header{align-items:flex-start;padding:10px 12px}.brand{font-size:12px}.header-tools{align-items:flex-end;flex-direction:column}.cloud-state{text-align:right}#composerView{display:block}.composer-nav{position:sticky;top:69px;z-index:20;height:auto;padding:9px;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.composer-nav .label{display:none}.composer-nav button{white-space:nowrap}.seen-card{margin:0;min-width:120px;padding:7px 10px}.seen-card strong{font-size:14px;margin:0}.composer-main{padding:18px 10px 60px}.composer-heading{align-items:flex-start;flex-direction:column}.section-toolbar{position:relative;left:auto;right:auto;top:auto;opacity:1;transform:none;flex-wrap:wrap;border-width:0 0 1px}.section-meta{flex:1 0 100%}.asset-drawer{top:auto;bottom:0;width:100%;height:min(72vh,650px);transform:translateY(102%);border-left:0;border-top:1px solid var(--line)}.asset-drawer.open{transform:translateY(0)}.drawer-grid{grid-template-columns:repeat(2,1fr)}#resultsView{padding:22px 12px 60px}.results-tools{align-items:flex-start;flex-direction:column}.results-filters{width:100%}.results-filters select{flex:1;min-width:140px}.ranking-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="brand">LUNEX SECTION LIBRARY</div>
  <div class="header-tools">
    <div class="view-switch"><button id="showComposer" class="active">拼装</button><button id="showResults">评审结果</button></div>
    <div class="cloud-state" id="cloudStatus">正在连接云端评审…</div>
  </div>
</header>

<section id="composerView">
  <aside class="composer-nav">
    <p class="label">COMPOSER / 拼装</p>
    <button class="primary" id="addCustomPage">＋ 自选页</button>
    <button id="randomizeComposer">🎲 随机拼装</button>
    <button id="restoreDefaults">恢复默认</button>
    <div class="seen-card"><strong id="seenProgress">0 / 154</strong>已看素材</div>
  </aside>
  <main class="composer-main">
    <div class="composer-heading"><div><h1>首页拼装</h1><p class="sub">直接在图片区块上切换、点赞、插页或拖动排序。</p></div><p class="sub" id="composerSummary"></p></div>
    <div class="composer-frame" id="composerCanvas"></div>
  </main>
</section>

<section id="resultsView" hidden>
  <div class="results-head"><h1>评审结果</h1><p class="sub">组合筛选全部素材的实时点赞结果；点击图片可放入当前拼装区块。</p></div>
  <div class="results-tools">
    <div class="results-filters">
      <select id="resultCategory" aria-label="结果分类"></select>
      <select id="resultVersion" aria-label="结果版本"></select>
      <select id="resultLikeStatus" aria-label="点赞状态"><option value="all">全部点赞状态</option><option value="positive">有人点赞</option><option value="mine">我点赞的</option><option value="zero">零票</option></select>
      <select id="resultSort" aria-label="结果排序"><option value="likes-desc">点赞最多</option><option value="likes-asc">点赞最少</option><option value="version-desc">版本新到旧</option><option value="version-asc">版本旧到新</option></select>
      <button id="clearResultFilters">清除筛选</button>
    </div>
    <p class="result-summary" id="resultSummary"></p>
  </div>
  <div class="ranking-grid" id="resultGrid"></div>
  <div id="resultEmpty" hidden>没有符合条件的图片。<button id="emptyClearFilters">清除筛选</button></div>
</section>

<aside id="assetDrawer" class="asset-drawer" aria-hidden="true">
  <div class="drawer-head"><h2 id="drawerTitle">选择素材</h2><button id="closeDrawer" aria-label="关闭图片选择">×</button></div>
  <div class="drawer-filters"><select id="drawerCategory" aria-label="素材分类"></select><select id="drawerVersion" aria-label="素材版本"></select></div>
  <div class="drawer-grid" id="drawerGrid"></div>
</aside>
<div class="toast" id="toast"></div>

<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app-data.js"></script>
<script src="app-state.js"></script>
<script src="app.js"></script>
</body>
</html>
